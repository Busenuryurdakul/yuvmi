name: API Staging

on:
  push:
    branches: [main, feat/busenur-foundation-hardening]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-staging.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build API binary
        run: go build -o /tmp/yuvmi-api ./cmd/server

      - name: Build Docker image
        run: docker build -f deployments/Dockerfile -t yuvmi-api:staging .

