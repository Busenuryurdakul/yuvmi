databases:
  - name: yuvmi-db
    databaseName: yuvmi
    user: yuvmi
    plan: free
    ipAllowList: []

services:
  # Redis service for caching and rate limiting
  - type: redis
    name: yuvmi-redis
    plan: free
    ipAllowList: []

  # Go API backend web service
  - type: web
    name: yuvmi-api
    runtime: go
    rootDir: apps/api
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 8080
      - key: WAITLIST_CLIENT_IP_MODE
        value: render
      - key: RENDER_SERVICE_TYPE
        value: web
      - key: WAITLIST_PRIVACY_POLICY_VERSION
        value: "2026-08-17"
      - key: WAITLIST_RATE_LIMIT_REQUESTS
        value: "20"
      - key: WAITLIST_RATE_LIMIT_WINDOW
        value: "60"
      - key: WAITLIST_RATE_LIMIT_HASH_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: yuvmi
      - key: JWT_ACCESS_EXPIRATION_MINUTES
        value: "60"
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        value: https://yuvmi.vercel.app,https://yuvmi-web.vercel.app
      - key: DB_HOST
        fromDatabase:
          name: yuvmi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: yuvmi-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: yuvmi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: yuvmi-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: yuvmi-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          type: redis
          name: yuvmi-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: yuvmi-redis
          property: port
      - key: YUVMI_ALLOW_DEV_OAUTH
        value: "0"
      - key: YUVMI_ALLOW_DEV_PREMIUM
        value: "0"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./data/uploads
