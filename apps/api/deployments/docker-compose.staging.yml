# Staging stack: PostgreSQL, Redis, MinIO (S3), API
# Usage: docker compose -f deployments/docker-compose.staging.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: yuvmi-staging-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-yuvmi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yuvmi}
      POSTGRES_DB: ${DB_NAME:-yuvmi}
    ports:
      - "${DB_HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yuvmi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuvmi-staging-redis
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yuvmi-staging-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-yuvmi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-yuvmi-secret-key}
    ports:
      - "${MINIO_HOST_BIND:-127.0.0.1}:9000:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET:-yuvmi-assets};
      mc anonymous set download local/$${S3_BUCKET:-yuvmi-assets}/public || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-yuvmi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-yuvmi-secret-key}
      S3_BUCKET: ${S3_BUCKET:-yuvmi-assets}

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: yuvmi-staging-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_ISSUER: yuvmi
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-yuvmi}
      DB_PASSWORD: ${DB_PASSWORD:-yuvmi}
      DB_NAME: ${DB_NAME:-yuvmi}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ENABLED: "false"
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-yuvmi-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-yuvmi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-yuvmi-secret-key}
      S3_USE_SSL: "false"
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-http://localhost:9000/yuvmi-assets}
      OAUTH_GOOGLE_CLIENT_IDS: ${OAUTH_GOOGLE_CLIENT_IDS:-}
      OAUTH_APPLE_BUNDLE_ID: ${OAUTH_APPLE_BUNDLE_ID:-com.yuvmi.app}
      YUVMI_ALLOW_DEV_OAUTH: ${YUVMI_ALLOW_DEV_OAUTH:-0}
      YUVMI_ALLOW_DEV_PREMIUM: ${YUVMI_ALLOW_DEV_PREMIUM:-0}
      YUVMI_LOG_PASSWORD_RESET: ${YUVMI_LOG_PASSWORD_RESET:-1}
      CRON_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}

volumes:
  pgdata:
  miniodata:
